<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EXCEED — ご相談のご予約</title>
<style>
  :root{
    --page:#15171C; --card:#1C1F26; --line:#282C36; --line-soft:#22262E;
    --text:#F4F5F7; --muted:#A9AFBA; --dim:#767D8A;
    --accent:#FFD84D; --accent-ink:#15171C; --bad:#FF6B5A; --good:#5ED6A4;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page); color:var(--text);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",
         "Noto Sans JP","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:28px 20px 72px;
  }
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
  .brand{font-weight:800;letter-spacing:.16em;font-size:13px}
  .brand span{color:var(--accent)}
  .lang{display:flex;gap:6px}
  .lang button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:5px 13px;font-size:12px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent);font-weight:700}
  h1{font-size:26px;line-height:1.3;margin:0 0 8px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 28px;font-size:15px}
  .steps{display:flex;gap:8px;margin-bottom:24px}
  .steps i{height:3px;flex:1;background:var(--line);border-radius:2px}
  .steps i.on{background:var(--accent)}
  section{display:none}
  section.on{display:block}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);
     margin:0 0 12px;font-weight:600}
  .opt{
    width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    color:var(--text);border-radius:var(--r);padding:16px 18px;margin-bottom:10px;
    cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .opt:hover{border-color:#39404E}
  .opt b{font-weight:600;font-size:16px}
  .opt small{color:var(--dim);font-size:13px;white-space:nowrap}
  .day{margin:20px 0 8px;color:var(--muted);font-size:13px;font-weight:600}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .slot{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px 6px;cursor:pointer;font-size:15px;
    font-variant-numeric:tabular-nums}
  .slot:hover{border-color:var(--accent);color:var(--accent)}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input,textarea{
    width:100%;background:#12141A;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:12px 14px;font:inherit;font-size:15px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:84px;resize:vertical}
  .btn{
    width:100%;background:var(--accent);color:var(--accent-ink);border:0;
    border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;
    margin-top:22px}
  .btn[disabled]{opacity:.5;cursor:default}
  .ghost{background:transparent;color:var(--muted);border:1px solid var(--line);
    font-weight:500;margin-top:10px}
  .back{background:none;border:0;color:var(--dim);cursor:pointer;padding:0;
    font-size:13px;margin-bottom:16px}
  .msg{border-radius:10px;padding:12px 14px;font-size:14px;margin-top:14px;display:none}
  .msg.err{display:block;background:rgba(255,107,90,.12);color:var(--bad);
    border:1px solid rgba(255,107,90,.3)}
  .done{text-align:center;padding:12px 0}
  .done .tick{width:52px;height:52px;border-radius:50%;background:rgba(94,214,164,.14);
    color:var(--good);display:flex;align-items:center;justify-content:center;
    font-size:26px;margin:0 auto 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:18px;margin-top:18px;text-align:left}
  .row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;font-size:15px}
  .row span{color:var(--dim)}
  .row b{font-weight:600;text-align:right}
  .tz{color:var(--dim);font-size:12px;margin-top:14px}
  .empty{color:var(--muted);background:var(--card);border:1px dashed var(--line);
    border-radius:var(--r);padding:22px;text-align:center;font-size:14px}
  footer{color:var(--dim);font-size:12px;text-align:center;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">EXCEED <span>BOX</span></div>
    <div class="lang">
      <button id="ja" aria-pressed="true">日本語</button>
      <button id="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <h1 data-t="title">ご相談のご予約</h1>
  <p class="sub" data-t="sub">ご希望の内容と日時をお選びください。</p>

  <div class="steps"><i id="s1" class="on"></i><i id="s2"></i><i id="s3"></i></div>

  <!-- 1 · topic -->
  <section id="step1" class="on">
    <h2 data-t="pick_topic">ご相談内容</h2>
    <div id="topics"></div>
  </section>

  <!-- 2 · time -->
  <section id="step2">
    <button class="back" data-t="back">← 戻る</button>
    <h2 data-t="pick_time">ご希望の日時</h2>
    <div id="slots"></div>
  </section>

  <!-- 3 · details -->
  <section id="step3">
    <button class="back" data-t="back">← 戻る</button>
    <h2 data-t="your_details">お客様情報</h2>
    <div class="card" id="chosen"></div>
    <label data-t="f_name">お名前</label><input id="name" autocomplete="name">
    <label data-t="f_email">メールアドレス</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label data-t="f_phone">電話番号（任意）</label>
    <input id="phone" autocomplete="tel" inputmode="tel">
    <label data-t="f_note">ご相談内容（任意）</label><textarea id="note"></textarea>
    <button class="btn" id="confirm" data-t="confirm">予約を確定する</button>
    <div class="msg" id="err"></div>
  </section>

  <!-- 4 · done -->
  <section id="step4">
    <div class="done">
      <div class="tick">✓</div>
      <h1 data-t="booked">ご予約を承りました</h1>
      <p class="sub" data-t="booked_sub">確認のためこの画面を保存してください。</p>
      <div class="card" id="summary"></div>
      <button class="ghost btn" id="cancel" data-t="cancel_btn">予約をキャンセルする</button>
      <div class="msg" id="err2"></div>
    </div>
  </section>

  <footer>EXCEED REAL ESTATE L.L.C.</footer>
</div>

<script>
// Deliberately dependency-free and inline. This page is served to strangers on
// unknown networks; a CDN script is one more thing that can break, be blocked,
// or watch a customer fill in their phone number.
const T = {
  ja:{title:"ご相談のご予約",sub:"ご希望の内容と日時をお選びください。",
      pick_topic:"ご相談内容",pick_time:"ご希望の日時",your_details:"お客様情報",
      back:"← 戻る",f_name:"お名前",f_email:"メールアドレス",f_phone:"電話番号（任意）",
      f_note:"ご相談内容（任意）",confirm:"予約を確定する",booked:"ご予約を承りました",
      booked_sub:"確認のためこの画面を保存してください。",cancel_btn:"予約をキャンセルする",
      none:"空き枠が見つかりませんでした。しばらくしてからお試しください。",
      cancelled:"ご予約をキャンセルしました。",
      tz:"時刻は日本時間（JST）で表示しています。",
      when:"日時",what:"ご相談内容",who:"お名前",ref:"予約番号",
      wait:"送信中…"},
  en:{title:"Book a consultation",sub:"Choose a topic and a time that suits you.",
      pick_topic:"Topic",pick_time:"Choose a time",your_details:"Your details",
      back:"← Back",f_name:"Name",f_email:"Email",f_phone:"Phone (optional)",
      f_note:"Anything you'd like us to know (optional)",confirm:"Confirm booking",
      booked:"Your booking is confirmed",booked_sub:"Please keep this page for reference.",
      cancel_btn:"Cancel this booking",
      none:"No times are available right now. Please try again shortly.",
      cancelled:"Your booking has been cancelled.",
      tz:"Times are shown in Japan Standard Time (JST).",
      when:"When",what:"Topic",who:"Name",ref:"Reference",
      wait:"Sending…"}
};
let lang = (navigator.language||"ja").startsWith("ja") ? "ja" : "en";
let topic = null, slot = null, ref = null;

// One random token per booking attempt. A double-click or a retry carries the
// same one so the customer gets a single appointment; a stranger cannot produce
// it. Idempotency must never be keyed on the customer's own details — those are
// guessable, and matching on them used to hand back the reference that lets the
// holder cancel the booking.
function newRequestId(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2,"0")).join("");
}
let requestId = newRequestId();

const $ = s => document.querySelector(s);
const t = k => (T[lang][k] || k);

function paint(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("#ja").setAttribute("aria-pressed", lang === "ja");
  $("#en").setAttribute("aria-pressed", lang === "en");
}
$("#ja").onclick = () => { lang="ja"; paint(); loadTopics(); };
$("#en").onclick = () => { lang="en"; paint(); loadTopics(); };

function step(n){
  [1,2,3,4].forEach(i => $("#step"+i).classList.toggle("on", i===n));
  [1,2,3].forEach(i => $("#s"+i).classList.toggle("on", i<=Math.min(n,3)));
  window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll(".back").forEach(b => b.onclick = () => step(
  $("#step3").classList.contains("on") ? 2 : 1));

// Times arrive as UTC and are rendered in Tokyo, because the office's day is
// what a slot means. Never format a slot with the visitor's own zone — a
// customer in London booking "10:00" must get the same 10:00 the rep sees.
const JST = {timeZone:"Asia/Tokyo"};
const fmtTime = iso => new Intl.DateTimeFormat(lang==="ja"?"ja-JP":"en-GB",
  {...JST, hour:"2-digit", minute:"2-digit"}).format(new Date(iso));
const fmtDay = iso => new Intl.DateTimeFormat(lang==="ja"?"ja-JP":"en-GB",
  {...JST, weekday:"short", month:"short", day:"numeric"}).format(new Date(iso));

async function api(path, opts){
  const r = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts});
  const body = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((body.error && body.error.message) || "Something went wrong.");
  return body;
}

async function loadTopics(){
  const box = $("#topics"); box.innerHTML = "";
  try{
    const {data} = await api("/api/public/booking/meeting-types");
    if(!data.length){ box.innerHTML = `<div class="empty">${t("none")}</div>`; return; }
    data.forEach(m => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<b>${esc(lang==="ja"?m.label_ja:m.label_en)}</b><small>${esc(m.duration_minutes)} min</small>`;
      b.onclick = () => { topic = m; loadSlots(); step(2); };
      box.appendChild(b);
    });
  }catch(e){ box.innerHTML = `<div class="empty">${t("none")}</div>`; }
}

async function loadSlots(){
  const box = $("#slots"); box.innerHTML = "";
  try{
    const {slots} = await api("/api/public/booking/slots?meeting_type="+encodeURIComponent(topic.key));
    if(!slots.length){ box.innerHTML = `<div class="empty">${t("none")}</div>`; return; }
    let day = null;
    slots.forEach(s => {
      const d = fmtDay(s.starts_at);
      if(d !== day){
        day = d;
        const h = document.createElement("div"); h.className="day"; h.textContent=d;
        box.appendChild(h);
        const g = document.createElement("div"); g.className="slots"; g.dataset.day=d;
        box.appendChild(g);
      }
      const g = box.querySelector(`.slots[data-day="${CSS.escape(d)}"]`);
      const b = document.createElement("button");
      b.className="slot"; b.textContent = fmtTime(s.starts_at);
      b.onclick = () => { slot = s; requestId = newRequestId(); showChosen(); step(3); };
      g.appendChild(b);
    });
    const tz = document.createElement("div"); tz.className="tz"; tz.textContent=t("tz");
    box.appendChild(tz);
  }catch(e){ box.innerHTML = `<div class="empty">${t("none")}</div>`; }
}

// Everything that reaches innerHTML goes through this. The only genuinely
// untrusted value on this page is the customer's own name coming back from the
// server, so the worst case is self-inflicted — but the codebase rule from the
// viewer.html incident is "any field that entered the system from outside is
// untrusted, forever", and a page that escapes by default cannot regress when
// someone later renders a rep's name or a note here.
function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function row(k,v){
  return `<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`;
}

function showChosen(){
  $("#chosen").innerHTML =
    row(t("what"), lang==="ja"?topic.label_ja:topic.label_en) +
    row(t("when"), `${fmtDay(slot.starts_at)} ${fmtTime(slot.starts_at)}`);
}

$("#confirm").onclick = async () => {
  const btn = $("#confirm"), err = $("#err");
  err.className = "msg"; btn.disabled = true; btn.textContent = t("wait");
  try{
    const b = await api("/api/public/booking/confirm", {method:"POST", body:JSON.stringify({
      meeting_type: topic.key, starts_at: slot.starts_at,
      request_id: requestId,
      name: $("#name").value, email: $("#email").value,
      phone: $("#phone").value, note: $("#note").value })});
    ref = b.ref;
    $("#summary").innerHTML =
      row(t("what"), lang==="ja"?b.label_ja:b.label_en) +
      row(t("when"), `${fmtDay(b.starts_at)} ${fmtTime(b.starts_at)}`) +
      row(t("who"), b.name) + row(t("ref"), b.ref.slice(0,8));
    step(4);
  }catch(e){
    err.textContent = e.message; err.className = "msg err";
  }finally{
    btn.disabled = false; btn.textContent = t("confirm");
  }
};

$("#cancel").onclick = async () => {
  const err = $("#err2");
  try{
    await api(`/api/public/booking/${encodeURIComponent(ref)}/cancel`, {method:"POST"});
    $("#summary").innerHTML = `<div class="row"><b>${esc(t("cancelled"))}</b></div>`;
    $("#cancel").style.display = "none";
  }catch(e){ err.textContent = e.message; err.className = "msg err"; }
};

paint();
loadTopics();
</script>
</body>
</html>
